<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>اليوم الترفيهي — منظّم الجدول</title>
<!-- لو حدّثت التطبيق على GitHub، زوّد رقم v في كل السطور دي عشان موبايلات
     المشرفين تجيب النسخة الجديدة بدل المخزّنة عندها -->
<link rel="stylesheet" href="assets/style.css?v=16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>

<!-- ======== شاشة الدخول ======== -->
<div id="login" class="login-wrap">
  <form class="login" id="loginForm" autocomplete="off">
    <div class="logo">🏆</div>
    <h1 id="loginTitle">اليوم الترفيهي</h1>
    <p class="muted small" id="loginHint">اكتب كلمة السر عشان تدخل</p>
    <div class="field">
      <input id="loginPass" type="password" inputmode="numeric" pattern="[0-9]*"
             placeholder="••••" autocomplete="off" aria-label="كلمة السر">
    </div>
    <div id="loginErr" class="alert bad hidden">كلمة السر غلط</div>
    <button class="btn primary block big" type="submit">دخول</button>
    <p class="small muted" style="margin-top:14px" id="loginStatus">
      ⏳ بيحمّل من جوجل شيت…
    </p>
  </form>
</div>

<!-- ======== التطبيق ======== -->
<div id="shell" class="hidden">
  <header class="topbar">
    <div class="brand" id="appTitle">اليوم الترفيهي</div>
    <span class="chip" id="backendChip">…</span>
    <button class="icon-btn" id="btnRefresh" title="تحديث">↻</button>
  </header>

  <main class="app" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="supervisor"><span class="ic">✅</span><span>المشرف</span></button>
    <button data-tab="board"><span class="ic">📺</span><span>العرض</span></button>
    <button data-tab="schedule"><span class="ic">🗓️</span><span>الجدول</span></button>
    <button data-tab="results"><span class="ic">🏅</span><span>النتائج</span></button>
    <button data-tab="setup"><span class="ic">⚙️</span><span>الإعداد</span></button>
  </nav>
</div>

<script src="assets/config.js?v=16"></script>
<script src="assets/scheduler.js?v=16"></script>
<script src="assets/api.js?v=16"></script>
<script src="assets/app.js?v=16"></script>
</body>
</html>
